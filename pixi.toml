[workspace]
name = "qsp-notebook-training"
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64"]

[system-requirements]
libc = "2.39"

[dependencies]
python = "=3.12"
r-irkernel = ">=1.3.2,<2"

[pypi-dependencies]
abm = "~=2.2"
ipykernel = "~=7.1"
numpy = "~=2.3"
pandas = "~=2.3"
ipywidgets = "~=8.1"
pzfx_parser = "~=0.4"
openpyxl = "~=3.1"
matplotlib = "~=3.10"
plotly = "~=6.4"
plotnine = "~=0.15"
nbmake = "~=1.5"
pytest = "~=9.0"
